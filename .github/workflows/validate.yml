name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install pyyaml jsonschema

      - name: Validate marketplace, plugins and content
        run: scripts/validate.sh

      - name: Build skill zips
        run: |
          for plugin in plugins/*/; do
            scripts/build-skill-zip.sh "$(basename "$plugin")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
          retention-days: 7
